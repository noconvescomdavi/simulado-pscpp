<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07141f" />
  <title>ESTIBORDO — sem conexão</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07141f;color:#f5f7fa;padding:28px}
    main{width:min(460px,100%);text-align:center;padding:36px 24px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.04)}
    h1{margin:0 0 12px;font-size:28px;letter-spacing:.04em}
    p{margin:0 0 24px;line-height:1.55;color:#cad4df}
    button{border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;background:#f5f7fa;color:#07141f;cursor:pointer}
    small{display:block;margin-top:20px;color:#8293a3}
  </style>
</head>
<body>
  <main>
    <h1>ESTIBORDO</h1>
    <p>Não foi possível conectar à plataforma. Verifique sua internet e tente novamente.</p>
    <button type="button" onclick="location.href='https://simulado-pscpp.vercel.app/'">Tentar novamente</button>
    <small>Se você estiver embarcado, tente novamente quando houver sinal disponível.</small>
  </main>
</body>
</html>
