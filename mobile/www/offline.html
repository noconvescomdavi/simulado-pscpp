<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#07141f" />
  <title>ESTIBORDO — modo offline</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07141f;color:#f5f7fa;padding:28px}
    main{width:min(500px,100%);text-align:center;padding:36px 24px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.04)}
    h1{margin:0 0 12px;font-size:28px;letter-spacing:.04em}
    p{margin:0 0 24px;line-height:1.55;color:#cad4df}
    .actions{display:grid;gap:10px}
    a,button{border:0;border-radius:14px;padding:14px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none}
    a{background:#f5f7fa;color:#07141f}
    button{background:transparent;color:#f5f7fa;border:1px solid rgba(255,255,255,.22)}
    small{display:block;margin-top:20px;color:#8293a3}
  </style>
</head>
<body>
  <main>
    <h1>ESTIBORDO</h1>
    <p>Você está sem conexão. Se o conteúdo offline já foi preparado neste aparelho, abra a Central Offline para continuar estudando.</p>
    <div class="actions">
      <a href="https://simulado-pscpp.vercel.app/offline">Abrir Central Offline</a>
      <button type="button" onclick="location.href='https://simulado-pscpp.vercel.app/'">Tentar conectar novamente</button>
    </div>
    <small>Cadernos, simulados e respostas locais serão sincronizados quando a internet voltar.</small>
  </main>
  <script>
    setTimeout(function(){
      location.href="https://simulado-pscpp.vercel.app/offline";
    },700);
  </script>
</body>
</html>
