plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.estibordo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.estibordo.app'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '0.7.0'
    }

    buildTypes {
        debug {
            debuggable false
            applicationIdSuffix ''
            versionNameSuffix ''
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
