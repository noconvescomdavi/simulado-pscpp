<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07141f">
  <title>ESTIBORDO | Sem conexão</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#07141f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:32px}
    main{max-width:520px;text-align:center}
    img{width:132px;height:132px;border-radius:28px;margin-bottom:24px}
    h1{font-size:30px;margin:0 0 12px}
    p{color:#b8c6d3;line-height:1.55;margin:0 0 22px}
    button{border:0;border-radius:14px;padding:14px 20px;font-size:16px;font-weight:700;background:#fff;color:#07141f}
  </style>
</head>
<body>
  <main>
    <img src="/pwa-icon" alt="ESTIBORDO">
    <h1>Sem conexão com a internet</h1>
    <p>A ESTIBORDO precisa de conexão para acessar simulados, progresso, banco de questões e demais dados atualizados da sua conta.</p>
    <button onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
