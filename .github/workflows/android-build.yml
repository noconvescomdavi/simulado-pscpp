name: Android Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'aplicativo/**'
      - '.github/workflows/android-build.yml'
      - 'data/**'
      - 'public/models/ripeam/**'
      - 'public/flashcards/**'
      - 'db/flashcards/**'
  push:
    branches: [main]
    paths:
      - 'aplicativo/**'
      - '.github/workflows/android-build.yml'
      - 'data/**'
      - 'public/models/ripeam/**'
      - 'public/flashcards/**'
      - 'db/flashcards/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aplicativo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK_ROOT" > "$GITHUB_WORKSPACE/aplicativo/local.properties"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Bundle ESTIBORDO offline content
        run: npm run android:bundle-content
      - name: Validate offline bundle
        run: npm run test:offline
      - name: Generate Android project
        run: npx cap add android
      - name: Pin Android SDK for Gradle
        run: printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > android/local.properties
      - name: Generate ESTIBORDO icons and splash
        run: npm run android:assets
      - name: Generate Play Store assets
        run: npm run play:assets
      - name: Configure Android release metadata
        env:
          ESTIBORDO_VERSION_CODE: ${{ github.run_number }}
          ESTIBORDO_VERSION_NAME: 1.0.${{ github.run_number }}
        run: npm run android:configure
      - name: Verify Capacitor
        run: npx cap doctor android
      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/estibordo-upload.jks
          fi
      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/aplicativo/android/estibordo-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-release-signing.mjs
      - name: Android lint
        run: ./gradlew lintDebug
        working-directory: aplicativo/android
      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: aplicativo/android
      - name: Build release AAB
        run: ./gradlew bundleRelease
        working-directory: aplicativo/android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: estibordo-debug-apk
          path: aplicativo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: estibordo-release-aab
          path: aplicativo/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Upload Play Store assets
        uses: actions/upload-artifact@v4
        with:
          name: estibordo-play-store-assets
          path: aplicativo/store-assets/
          if-no-files-found: error
