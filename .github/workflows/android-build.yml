name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - feat/estibordo-android
    paths:
      - 'mobile/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Generate ESTIBORDO icons and splash
        run: npm run android:assets

      - name: Verify Capacitor
        run: npx cap doctor android

      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/estibordo-upload.jks
            echo "Upload keystore preparado."
          else
            echo "Sem keystore configurado: AAB será gerado sem assinatura de upload."
          fi

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/mobile/android/estibordo-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-release-signing.mjs

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: mobile/android

      - name: Build release AAB
        run: ./gradlew bundleRelease
        working-directory: mobile/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: estibordo-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: estibordo-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
