name: Format Miguens Integrated Banks

on:
  push:
    branches: [feature/miguens-v3-bancos-378]
    paths:
      - .github/workflows/format-miguens-integrated-banks.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/miguens-v3-bancos-378
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format banks
        run: node scripts/format-miguens-integrated-banks.mjs
      - name: Validate totals
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const nav = JSON.parse(fs.readFileSync('data/questions/navegacao-aguas-restritas.json','utf8'));
          const met = JSON.parse(fs.readFileSync('data/questions/meteorologia-oceanografia.json','utf8'));
          if (nav.questions.length !== 2080) throw new Error('NAV total ' + nav.questions.length);
          if (met.questions.length !== 1353) throw new Error('MET total ' + met.questions.length);
          console.log(JSON.stringify({nav:nav.questions.length,met:met.questions.length}));
          NODE
      - name: Commit formatted banks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/navegacao-aguas-restritas.json data/questions/meteorologia-oceanografia.json
          git diff --cached --quiet || git commit -m "style(questions): restaura formatação dos bancos Miguens"
          git push
