name: Validate RIPEAM GLB texture fix
on:
  push:
    branches:
      - fix/ripeam-glb-texture-csp-20260911

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
