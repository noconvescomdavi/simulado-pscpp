name: Audit Artificial Question Sources
on:
  push:
    branches: [fix/full-context-legislation-stems]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - name: Scan all source layers
        run: node scripts/audit-artificial-question-sources.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artificial-question-sources
          path: reports/artificial-question-sources.json
