name: Validate RIPEAM day night presets
on:
  push:
    branches:
      - feat/ripeam-day-night-signal-presets-20260911
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
