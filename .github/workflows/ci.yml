name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository hygiene
        run: npm run check:repo

      - name: Validate question banks
        run: npm run validate:questions

      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
          AUTH_SESSION_DAYS: 30
        run: npm run build

      - name: HTTP smoke E2E
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
          AUTH_SESSION_DAYS: 30
        run: |
          npm start > /tmp/estibordo-next.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT
          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/api/health?shallow=1" >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:3000/api/health?shallow=1"
          curl -fsS "http://127.0.0.1:3000/robots.txt" >/dev/null
          curl -fsS "http://127.0.0.1:3000/sitemap.xml" >/dev/null
