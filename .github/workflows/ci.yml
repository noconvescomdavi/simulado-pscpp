name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Repository hygiene
        run: npm run check:repo

      - name: Study Plan V3 invariants
        run: npm run validate:study-plan

      - name: Google Drive library invariants
        run: npm run validate:drive-library

      - name: Learning algorithm tests
        run: npm run test:learning

      - name: Validate question banks
        run: npm run validate:questions

      - name: Audit question formatting
        run: npm run test:question-structure

      - name: Audit question semantics and terminology
        id: semantic_audit
        continue-on-error: true
        run: npm run audit:questions:semantic

      - name: Upload semantic audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-semantic-audit
          path: reports/question-semantic-audit.json

      - name: Enforce semantic audit
        if: steps.semantic_audit.outcome == 'failure'
        run: exit 1

      - name: Build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
          AUTH_SESSION_DAYS: 30
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: npm run build

      - name: HTTP smoke E2E
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only
          AUTH_SESSION_DAYS: 30
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
        run: |
          npm start > /tmp/estibordo-next.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT

          for i in {1..30}; do
            if curl -fsS "http://127.0.0.1:3000/api/health?shallow=1" >/dev/null; then
              break
            fi
            sleep 1
          done

          # Infraestrutura pública
          curl -fsS "http://127.0.0.1:3000/api/health?shallow=1"

          # CSP: geral rígida; exceção unsafe-eval somente no runtime 3D
          STRICT_CSP=$(curl -sSI "http://127.0.0.1:3000/login" | tr -d "\r" | grep -i "^content-security-policy:" | head -1)
          echo "$STRICT_CSP" | grep -q "script-src"
          if echo "$STRICT_CSP" | grep -q "unsafe-eval"; then exit 1; fi
          THREE_CSP=$(curl -sSI "http://127.0.0.1:3000/flashcards/ripeam/3d" | tr -d "\r" | grep -i "^content-security-policy:" | head -1)
          echo "$THREE_CSP" | grep -q "unsafe-eval"
          curl -fsS "http://127.0.0.1:3000/robots.txt" >/dev/null
          curl -fsS "http://127.0.0.1:3000/sitemap.xml" >/dev/null

          # Páginas críticas de aquisição
          curl -fsS "http://127.0.0.1:3000/login" -o /tmp/smoke-login.html
          grep -q "Entrar" /tmp/smoke-login.html
          curl -fsS "http://127.0.0.1:3000/cadastro" -o /tmp/smoke-cadastro.html
          grep -q "Criar conta" /tmp/smoke-cadastro.html
          curl -fsS "http://127.0.0.1:3000/termos-de-uso" -o /tmp/smoke-termos.html
          grep -q "Termos de Uso" /tmp/smoke-termos.html
          curl -fsS "http://127.0.0.1:3000/politica-de-privacidade" -o /tmp/smoke-privacidade.html
          grep -q "Política de Privacidade" /tmp/smoke-privacidade.html
          curl -fsS "http://127.0.0.1:3000/politica-de-cookies" -o /tmp/smoke-cookies.html
          grep -q "Política de Cookies" /tmp/smoke-cookies.html
          curl -fsS "http://127.0.0.1:3000/verificar-email" -o /tmp/smoke-email.html
          grep -q "Verifique sua caixa de entrada" /tmp/smoke-email.html
          curl -fsS "http://127.0.0.1:3000/plataforma" -o /tmp/smoke-plataforma.html
          grep -q "preparação" /tmp/smoke-plataforma.html
          curl -fsS "http://127.0.0.1:3000/produtos" -o /tmp/smoke-produtos.html
          grep -q "PSCPP" /tmp/smoke-produtos.html

          # /comprar exige autenticação e deve redirecionar sem sessão
          BUY_HEADERS=$(curl -sS -o /dev/null -D - "http://127.0.0.1:3000/comprar")
          echo "$BUY_HEADERS" | grep -Eq "HTTP/1.1 30[2378]|HTTP/1.1 307"
          echo "$BUY_HEADERS" | grep -qi "location:.*cadastro"

          # Learning Engine: endpoints privados devem falhar fechados sem sessão
          for ENDPOINT in \
            "/api/learning-graph" \
            "/api/study-plan/session" \
            "/api/study-plan/snapshot" \
            "/api/study-plan/unavailability"; do
            if [ "$ENDPOINT" = "/api/learning-graph" ]; then
              STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$ENDPOINT")
            else
              STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "http://127.0.0.1:3000$ENDPOINT" -H "Content-Type: application/json" -d '{}')
            fi
            test "$STATUS" = "401"
          done

          TRAJ_HEADERS=$(curl -sS -o /dev/null -D - "http://127.0.0.1:3000/minha-trajetoria")
          echo "$TRAJ_HEADERS" | grep -Eq "HTTP/1.1 30[2378]|HTTP/1.1 307"
          echo "$TRAJ_HEADERS" | grep -qi "location:.*login"

          # Privacidade: exportação deve falhar fechada sem sessão
          EXPORT_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/api/account/export")
          test "$EXPORT_STATUS" = "401"

          # Biblioteca Google Drive: APIs privadas devem falhar fechadas sem sessão
          for ENDPOINT in \
            "/api/library/google/status" \
            "/api/library/google/picker" \
            "/api/library/google/files"; do
            STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000$ENDPOINT")
            test "$STATUS" = "401"
          done

          # Checkout aceita apenas POST; GET não pode iniciar cobrança
          CHECKOUT_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "http://127.0.0.1:3000/api/payments/mercado-pago/checkout")
          test "$CHECKOUT_STATUS" = "405"

          # Webhook sem credenciais deve falhar fechado, nunca processar evento
          WEBHOOK_STATUS=$(curl -sS -o /tmp/webhook.json -w "%{http_code}"             -X POST "http://127.0.0.1:3000/api/payments/mercado-pago/webhook"             -H "Content-Type: application/json"             -d '{"type":"payment","data":{"id":"123"}}')
          test "$WEBHOOK_STATUS" = "503"
          grep -q "Integração indisponível" /tmp/webhook.json

          # Browser smoke E2E: hidratação/renderização em Chrome headless real
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium não encontrado na runner."
            exit 1
          fi
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom "http://127.0.0.1:3000/login" > /tmp/browser-login.html
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom "http://127.0.0.1:3000/cadastro" > /tmp/browser-cadastro.html
          "$CHROME" --headless --no-sandbox --disable-gpu --dump-dom "http://127.0.0.1:3000/politica-de-privacidade" > /tmp/browser-privacy.html
          grep -q "Entrar na plataforma" /tmp/browser-login.html
          grep -q "Criar minha conta" /tmp/browser-cadastro.html
          grep -q "Política de Privacidade" /tmp/browser-privacy.html

          echo "Smoke tests críticos concluídos."