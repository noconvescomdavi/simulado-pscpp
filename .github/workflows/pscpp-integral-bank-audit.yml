name: PSCPP Integral Bank Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'data/questions/*.json'
      - 'data/pscpp/generated-batches/*.json'
      - 'lib/generated-pscpp-batches.js'
      - 'lib/pscpp-exam-bank.js'
      - 'lib/question-banks.js'
      - 'lib/question-quality-policy.js'
      - 'lib/learning-algorithms.js'
      - 'scripts/**'
      - 'package.json'
  push:
    branches:
      - feature/auditoria-integral-banco-normal-pscpp
    paths:
      - 'data/questions/*.json'
      - 'data/pscpp/generated-batches/*.json'
      - 'lib/generated-pscpp-batches.js'
      - 'lib/pscpp-exam-bank.js'
      - 'lib/question-banks.js'
      - 'lib/question-quality-policy.js'
      - 'lib/learning-algorithms.js'
      - 'scripts/audit-question-quality-v2.mjs'
      - 'scripts/audit-pscpp-integral-source-review.mjs'
      - 'scripts/validate-question-banks.mjs'
      - 'package.json'
      - '.github/workflows/pscpp-integral-bank-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Learning algorithm tests
        run: npm run test:learning
      - name: Structural question validation
        run: npm run validate:questions
      - name: Semantic quality audit
        run: node scripts/audit-question-quality-v2.mjs
      - name: Integral final bank audit
        run: npm run audit:pscpp:final
      - name: Complete source-layer quality gate
        run: node --experimental-specifier-resolution=node scripts/audit-pscpp-integral-source-review.mjs
      - name: Upload integral audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pscpp-integral-source-review
          path: reports/pscpp-integral-source-review.json
          if-no-files-found: error
      - name: Question structure tests
        run: npm run test:question-structure
      - name: Taxonomy validation
        run: npm run validate:taxonomy
      - name: Historical blueprint validation
        run: npm run validate:historical-blueprint
      - name: Production build
        run: npm run build
