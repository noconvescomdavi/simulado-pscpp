name: Focused Arte Naval Meteorologia PSCPP V7
on:
  push:
    branches: [main]
    paths:
      - 'scripts/focused-arte-meteo-pscpp-v7.mjs'
      - '.github/workflows/focused-arte-meteo-pscpp-v7.yml'
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[pscpp-v7-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - run: node scripts/focused-arte-meteo-pscpp-v7.mjs
      - run: |
          node scripts/audit-question-quality-v2.mjs
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit V7
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/arte-naval.json data/questions/meteorologia-oceanografia.json reports/pscpp-focused-extension-v7.json reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: aprofunda Arte Naval e Meteorologia no padrão PSCPP [pscpp-v7-output]"
          git pull --rebase origin main
          git push origin HEAD:main
