name: Repair Generic Templates Batches
on:
  workflow_dispatch:
  push:
    branches: [fix/generic-templates-batches-50]
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[batch-output]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair 308 generic templates
        run: node scripts/repair-main-question-generic-templates.mjs
      - name: Quarantine unresolved templates and duplicates
        run: node scripts/quarantine-final-generic-and-duplicates.mjs
      - name: Audit all main question banks
        env:
          QUESTIONS_MAIN_ONLY: "1"
        run: node scripts/audit-full-question-bank.mjs
      - name: Commit validated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/arte-naval.json reports/generic-template-repair.json reports/full-question-bank-audit.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "fix(questions): apply 308 generic-template repairs [batch-output]"
            git push origin HEAD:fix/generic-templates-batches-50
          fi
