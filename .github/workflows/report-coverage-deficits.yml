name: Report Coverage Deficits
on:
  push:
    branches: [feat/bancos-v2-todas-materias-20260905]
    paths:
      - 'scripts/report-coverage-deficits.mjs'
      - '.github/workflows/report-coverage-deficits.yml'
permissions:
  contents: write
jobs:
  report:
    if: ${{ !contains(github.event.head_commit.message, '[deficits-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bancos-v2-todas-materias-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/report-coverage-deficits.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/coverage-deficits-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: registra déficits de cobertura [deficits-output]"
          git push origin HEAD:feat/bancos-v2-todas-materias-20260905
