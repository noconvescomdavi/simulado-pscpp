name: Apply NORMAM-112 patch once

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/normam112-patch-once.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate NORMAM-112 patch
        run: node scripts/apply-normam112-patch.mjs

      - name: Commit corrected bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/legislacao-regulamentacao.json
          git diff --cached --quiet && exit 1
          git commit -m "fix(questions): contextualiza NORMAM-112 e diversifica alternativas"
          git push origin HEAD:main


