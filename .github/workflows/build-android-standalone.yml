name: Build ESTIBORDO Standalone Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "android/**"
      - "app/**"
      - "lib/standalone/**"
      - "lib/offline-store.js"
      - "data/**"
      - "scripts/build-standalone.mjs"
      - "next.config.mjs"
      - "package.json"
      - ".github/workflows/build-android-standalone.yml"

permissions:
  contents: read

jobs:
  build-standalone-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Audit Android local persistence
        run: npm run audit:android:local-persistence
      - name: Audit Android exam lifecycle
        run: npm run audit:android:exam-runtime
      - name: Validate PSCPP fixed matrix
        run: npm run test:pscpp:fixed
      - name: Zero-server audit
        run: npm run audit:standalone
      - name: Build standalone web bundle
        env:
          NEXT_PUBLIC_ESTIBORDO_STANDALONE: "1"
        run: npm run build:standalone
      - name: Verify standalone routes and assets
        run: |
          test -f out/area-do-aluno/index.html
          test -f out/simulado/index.html
          test -f out/simulado/simulado-pscpp/index.html
          test -f out/simulado/manobrabilidade/index.html
          test -f out/perfil/index.html
          test -f out/minha-trajetoria/index.html
          test -d out/_next/static
          find out/_next/static -type f | grep -q .
          grep -q "/_next/static" out/area-do-aluno/index.html
          test "$(find out/_next/static -type f -name "*.js" | wc -l)" -gt 0
          test "$(find out/_next/static -type f -name "*.css" | wc -l)" -gt 0
      - name: Copy bundle into Android assets
        run: |
          rm -rf android/app/src/main/assets/www
          mkdir -p android/app/src/main/assets/www
          cp -R out/. android/app/src/main/assets/www/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK packages
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true; /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Verify local-runtime architecture
        run: |
          grep -q "127.0.0.1" android/app/src/main/java/br/com/estibordo/app/MainActivity.java
          grep -q "ServerSocket" android/app/src/main/java/br/com/estibordo/app/LocalHttpServer.java
          grep -q "SQLiteOpenHelper" android/app/src/main/java/br/com/estibordo/app/EstibordoDatabase.java
          grep -q "addJavascriptInterface" android/app/src/main/java/br/com/estibordo/app/MainActivity.java
          grep -q "EstibordoLocal" android/app/src/main/java/br/com/estibordo/app/LocalDataBridge.java
          grep -q "androidPut" lib/standalone/android-store.js
          grep -q "getLatestOfflineExam" 'app/simulado/[subject]/Client.js'
          grep -q "private_seed_installed" android/app/src/main/java/br/com/estibordo/app/PrivateSeedImporter.java
          grep -q "PrivateSeedImporter" android/app/src/main/java/br/com/estibordo/app/MainActivity.java
          grep -q "VERSION=2" android/app/src/main/java/br/com/estibordo/app/EstibordoDatabase.java
          grep -q "journal" android/app/src/main/java/br/com/estibordo/app/EstibordoDatabase.java
          test -f android/app/src/androidTest/java/br/com/estibordo/app/DatabasePersistenceTest.java
          test -f data/manifest.json
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Android persistence tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          script: cd android && gradle --no-daemon connectedDebugAndroidTest
      - name: Verify APK has bundled site
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/www/area-do-aluno/index.html"
          unzip -p android/app/build/outputs/apk/debug/app-debug.apk classes.dex | strings | grep -q "127.0.0.1"
          ! unzip -p android/app/build/outputs/apk/debug/app-debug.apk classes.dex | strings | grep -Eqi "neon\\.tech|vercel\\.app"
      - uses: actions/upload-artifact@v4
        with:
          name: ESTIBORDO-Standalone-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
