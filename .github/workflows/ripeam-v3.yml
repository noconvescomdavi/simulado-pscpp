name: RIPEAM Editor Pro V3
on:
  push:
    branches: [feat/ripeam-editor-pro-v3-20260910]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply V3 upgrade
        run: python scripts/upgrade-ripeam-v3.py
      - name: Validate GLB regression guard
        run: node scripts/check-ripeam-glb-regression.mjs
      - name: Validate manual publication invariant
        run: |
          ! grep -q 'setTimeout(()=>save("draft"' app/admin/laboratorio-3d/Admin3DEditor.js
          grep -q 'action:"publish"' app/admin/laboratorio-3d/Admin3DEditor.js
          grep -q 'geometricRipeamIssues' app/admin/laboratorio-3d/Admin3DEditor.js
          grep -q 'MATERIAL_CHANNELS' app/admin/laboratorio-3d/Admin3DEditor.js
          grep -q 'showAnchors' app/admin/laboratorio-3d/Admin3DViewport.js
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit validated V3
        run: |
          rm -f .github/workflows/ripeam-v3.yml scripts/upgrade-ripeam-v3.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(editor-3d): adiciona ferramentas profissionais v3'
          git push origin HEAD:feat/ripeam-editor-pro-v3-20260910
