name: Expand Manobrabilidade Coverage
on:
  push:
    branches: [feat/manobrabilidade-taxonomia-v2-20260905]
    paths:
      - 'scripts/expand-manobrabilidade-coverage.mjs'
      - '.github/workflows/expand-manobrabilidade-coverage.yml'
permissions:
  contents: write
jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, '[coverage-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manobrabilidade-taxonomia-v2-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Expand coverage
        run: node scripts/expand-manobrabilidade-coverage.mjs
      - name: Commit expanded bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/manobrabilidade.json reports/manobrabilidade-expansion.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: completa cobertura mínima de manobrabilidade [coverage-output]"
          git push origin HEAD:feat/manobrabilidade-taxonomia-v2-20260905
