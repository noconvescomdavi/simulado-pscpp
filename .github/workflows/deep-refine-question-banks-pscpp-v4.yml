name: Deep Refine Question Banks PSCPP V4

on:
  push:
    branches: [main]
    paths:
      - 'scripts/deep-refine-question-banks-pscpp-v4.mjs'
      - '.github/workflows/deep-refine-question-banks-pscpp-v4.yml'

permissions:
  contents: write

jobs:
  refine:
    if: ${{ !contains(github.event.head_commit.message, '[pscpp-v4-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - name: Deep refine against PSCPP benchmark
        run: node scripts/deep-refine-question-banks-pscpp-v4.mjs
      - name: Audit and validate
        run: |
          node scripts/audit-question-quality-v2.mjs
          node scripts/extract-question-quality-samples.mjs
          node scripts/report-question-stem-patterns.mjs
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit V4 output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json reports/pscpp-deep-refine-v4.json reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/question-quality-samples.md reports/question-stem-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: aprofunda bancos no padrão PSCPP [pscpp-v4-output]"
          git pull --rebase origin main
          git push origin HEAD:main
