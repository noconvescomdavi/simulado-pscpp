name: Repair Legislation Full Context Stems
on:
  push:
    branches: [fix/full-context-legislation-stems]
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[context-output]') }}
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/repair-legislation-full-context-stems.mjs
      - run: QUESTIONS_MAIN_ONLY=1 node scripts/audit-full-question-bank.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/legislacao-regulamentacao.json reports/full-question-bank-audit.json
          git commit -m "fix(questions): apply full-context legislation stems [context-output]" || exit 0
          git push
