name: Build Arte Naval Cap8 501 Clean
on:
  push:
    branches: [feature/pscpp-arte-naval-cap8-501-clean]
    paths: ['.github/workflows/build-cap8-501-clean.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pscpp-arte-naval-cap8-501-clean
          fetch-depth: 0
      - name: Decode
        run: cat tmp/cap8.part1 tmp/cap8.part2 tmp/cap8.part3 tmp/cap8.part4 tmp/cap8.part5 tmp/cap8.part6 | base64 -d | gzip -d > data/pscpp/arte-naval-cap8-501.json
      - name: Validate
        run: node -e "const d=require('./data/pscpp/arte-naval-cap8-501.json'); if(d.questions.length!==501) throw Error('count'); const ids=new Set(d.questions.map(q=>q.id)); if(ids.size!==501) throw Error('ids'); for(const q of d.questions){if(q.options.length!==5||!q.options.some(o=>o.key===q.correct_answer)||q.bank!=='PSCPP'||q.origin!=='generated_pscpp'||!q.source?.locator?.includes('item 8.')) throw Error(q.id)}; console.log('validated',d.questions.length)"
      - name: Integrate loader
        run: |
          python -c "p='lib/pscpp-exam-bank.js';s=open(p,encoding='utf-8').read();a='import arteNavalCap23Questions from \"../data/pscpp/arte-naval-cap2-cap3-459.json\";';i='import arteNavalCap8Questions from \"../data/pscpp/arte-naval-cap8-501.json\";';s=s if i in s else s.replace(a,a+'\\n'+i);a2='  ...valid(arteNavalCap23Questions.questions),';e='  ...valid(arteNavalCap8Questions.questions),';s=s if e in s else s.replace(a2,a2+'\\n'+e);open(p,'w',encoding='utf-8').write(s)"
      - name: Clean and commit
        run: |
          rm -rf tmp/cap8.part*
          rm .github/workflows/build-cap8-501-clean.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integra 501 questões auditadas de Arte Naval capítulo 8"
          git push
