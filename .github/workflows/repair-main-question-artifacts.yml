name: Repair Main Question Extraction Artifacts
on:
  workflow_dispatch:
  push:
    branches: [fix/main-question-bank-extraction-artifacts]
jobs:
  repair-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/repair-main-question-extraction-artifacts.mjs
      - run: node scripts/repair-main-question-generic-templates.mjs
      - name: Audit repaired working tree
        env:
          QUESTIONS_MAIN_ONLY: "1"
        run: node scripts/audit-full-question-bank.mjs || true
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-main-question-banks
          path: |
            data/questions/*.json
            reports/extraction-artifact-repair.json
            reports/generic-template-repair.json
            reports/full-question-bank-audit.json
