name: Repair Main Question Extraction Artifacts
on:
  workflow_dispatch:
  push:
    branches: [fix/main-question-bank-extraction-artifacts]
jobs:
  repair-preview:
    if: ${{ !contains(github.event.head_commit.message || '', '[repair-output]') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore clean question sources from main
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- data/questions
      - run: node scripts/repair-main-question-extraction-artifacts.mjs
      - run: node scripts/repair-main-question-generic-templates.mjs
      - run: node scripts/repair-main-question-explanation-keys.mjs
      - run: node scripts/quarantine-main-question-duplicate-stems.mjs
      - name: Audit repaired working tree
        env:
          QUESTIONS_MAIN_ONLY: "1"
        run: node scripts/audit-full-question-bank.mjs || true
      - name: Commit validated repaired banks
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json reports/*.json
          if git diff --cached --quiet; then
            echo "No repair output changes to commit."
          else
            git commit -m "fix(questions): apply validated full-bank repairs [repair-output]"
            git push origin HEAD:fix/main-question-bank-extraction-artifacts
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: repaired-main-question-banks
          path: |
            data/questions/*.json
            reports/extraction-artifact-repair.json
            reports/generic-template-repair.json
            reports/explanation-key-repair.json
            reports/duplicate-quarantine.json
            reports/full-question-bank-audit.json
