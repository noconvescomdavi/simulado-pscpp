name: Audit All Question Banks
on:
  push:
    branches: [feat/bancos-v2-todas-materias-20260905]
    paths:
      - 'scripts/audit-all-question-banks.mjs'
      - '.github/workflows/audit-all-question-banks.yml'
permissions:
  contents: write
jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[audit-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bancos-v2-todas-materias-20260905
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate audit
        run: node scripts/audit-all-question-banks.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/all-question-banks-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualiza auditoria dos bancos [audit-output]"
          git push origin HEAD:feat/bancos-v2-todas-materias-20260905
