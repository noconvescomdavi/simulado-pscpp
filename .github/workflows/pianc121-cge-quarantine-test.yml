name: Validate PIANC 121 CGE Quarantine
on:
  push:
    branches: [feature/pianc121-cge-cap1-quarentena]
    paths:
      - 'scripts/test-pianc121-cge-quarantine.mjs'
      - 'data/questions/conhecimentos-gerais.json'
      - 'lib/question-quality-policy.js'
      - 'lib/question-taxonomy.js'
      - '.github/workflows/pianc121-cge-quarantine-test.yml'
  pull_request:
    paths:
      - 'scripts/test-pianc121-cge-quarantine.mjs'
      - 'data/questions/conhecimentos-gerais.json'
      - 'lib/question-quality-policy.js'
      - 'lib/question-taxonomy.js'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-pianc121-cge-quarantine.mjs
      - name: Generate runtime caderno banks
        run: node --no-warnings --experimental-loader ./scripts/pscpp-json-loader.mjs scripts/generate-runtime-question-banks.mjs
      - name: Assert quarantined PIANC questions are excluded from runtime
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const runtime=JSON.parse(fs.readFileSync('data/questions/runtime-active-banks.json','utf8'));
          const bank=runtime.banks['conhecimentos-gerais'];
          assert.ok(bank && Array.isArray(bank.questions));
          const leaked=bank.questions.filter(q=>String(q.id||'').startsWith('CGE-PIANC121-C1-'));
          assert.equal(leaked.length,0,'PIANC questions leaked into active runtime');
          console.log('PASS: no PIANC quarantine questions in generated runtime bank.');
          NODE
