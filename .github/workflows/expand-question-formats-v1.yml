name: Expand Question Formats V1

on:
  push:
    branches:
      - feat/expansao-formatos-questoes-20260906
    paths:
      - 'scripts/expand-question-formats-v1.mjs'
      - '.github/workflows/expand-question-formats-v1.yml'

permissions:
  contents: write

jobs:
  expand:
    if: ${{ !contains(github.event.head_commit.message, '[format-expansion-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/expansao-formatos-questoes-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Harden generator quality checks
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/expand-question-formats-v1.mjs')
          s = p.read_text(encoding='utf-8')
          old_prompt = "question: `Considerando ${chapterLabel(bases[0])}, assinale a alternativa INCORRETA.`,"
          new_prompt = "question: `Considerando ${chapterLabel(bases[0])} e o problema-base “${clean(bases[0].question)}”, assinale a alternativa INCORRETA entre as cinco afirmações apresentadas.`,"
          if old_prompt in s:
              s = s.replace(old_prompt, new_prompt)
          old_block = """  const existingPrompts = new Set(originalQuestions.map(q => norm(q.question)));
  for (const q of added) {
    if (existingIds.has(String(q.id)) || newIds.has(String(q.id))) throw new Error(`${subjectSlug}: ID duplicado ${q.id}`);
    newIds.add(String(q.id));
    const sig = norm(q.question);
    if (!sig || existingPrompts.has(sig)) throw new Error(`${subjectSlug}: enunciado duplicado ${q.id}`);
    existingPrompts.add(sig);
  }
"""
          new_block = """  const existingSignatures = new Set(originalQuestions.map(q => norm(`${q.question}|${(q.options || []).map(o => o.text).join('|')}`)));
  for (const q of added) {
    if (existingIds.has(String(q.id)) || newIds.has(String(q.id))) throw new Error(`${subjectSlug}: ID duplicado ${q.id}`);
    newIds.add(String(q.id));
    const sig = norm(`${q.question}|${(q.options || []).map(o => o.text).join('|')}`);
    if (!sig || existingSignatures.has(sig)) throw new Error(`${subjectSlug}: item duplicado ${q.id}`);
    existingSignatures.add(sig);
  }
"""
          if old_block not in s:
              raise SystemExit('Bloco de validação esperado não localizado no gerador')
          s = s.replace(old_block, new_block)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Generate new question formats
        run: node scripts/expand-question-formats-v1.mjs
      - name: Synchronize validation totals
        run: node scripts/sync-question-validation-totals.mjs
      - name: Validate complete repository
        run: npm run validate
      - name: Commit generated expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/expand-question-formats-v1.mjs data/questions/*.json reports/format-expansion-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: adiciona novos formatos de questões [format-expansion-output]"
          git pull --rebase origin feat/expansao-formatos-questoes-20260906
          git push origin HEAD:feat/expansao-formatos-questoes-20260906
