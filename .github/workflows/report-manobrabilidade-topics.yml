name: Report Manobrabilidade Topics
on:
  push:
    branches: [feat/manobrabilidade-taxonomia-v2-20260905]
    paths:
      - 'scripts/report-manobrabilidade-topics.mjs'
      - '.github/workflows/report-manobrabilidade-topics.yml'
permissions:
  contents: write
jobs:
  report:
    if: ${{ !contains(github.event.head_commit.message, '[topic-report]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/manobrabilidade-taxonomia-v2-20260905
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/report-manobrabilidade-topics.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/manobrabilidade-topic-distribution.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualiza tópicos de manobrabilidade [topic-report]"
          git push origin HEAD:feat/manobrabilidade-taxonomia-v2-20260905
