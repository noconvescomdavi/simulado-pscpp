name: Repair PSCPP V3 Quality

on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair-question-banks-pscpp-v3.mjs'
      - '.github/workflows/repair-question-banks-pscpp-v3.yml'

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[pscpp-repair-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - run: node scripts/repair-question-banks-pscpp-v3.mjs
      - run: |
          node scripts/audit-question-quality-v2.mjs
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json reports/pscpp-repair-v3.json reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: elimina falhas críticas pós-refinamento [pscpp-repair-output]"
          git pull --rebase origin main
          git push origin HEAD:main
