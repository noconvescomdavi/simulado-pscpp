          '''export const PERFORMANCE_BUDGET={triangles:350000,drawCalls:220,textures:80,estimatedTextureMB:256,models:12};''',
          '''export const PERFORMANCE_BUDGET={triangles:350000,drawCalls:220,textures:80,materials:180,estimatedTextureMB:256,models:12};''')
          patch(p,
          '''  if((stats.textures||0)>PERFORMANCE_BUDGET.textures)issues.push("Texturas acima do orçamento");''',
          '''  if((stats.textures||0)>PERFORMANCE_BUDGET.textures)issues.push("Texturas acima do orçamento");\n  if((stats.materials||0)>PERFORMANCE_BUDGET.materials)issues.push("Materiais acima do orçamento");\n  if((stats.modelErrors||0)>0)issues.push("Há modelos com falha de carregamento");''')

          # Remove stale forbidden Rule 27(d) variants wherever accidentally reintroduced in the editor presets/client.
          for fp in ['app/admin/laboratorio-3d/editor-presets.js','app/flashcards/ripeam/3d/Ripeam3DClient.js']:
