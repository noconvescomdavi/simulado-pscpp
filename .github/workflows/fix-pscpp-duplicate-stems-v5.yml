name: Fix PSCPP Duplicate Stems V5

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-pscpp-duplicate-stems-v5.mjs'
      - '.github/workflows/fix-pscpp-duplicate-stems-v5.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[stem-dedup-v5-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - run: node scripts/fix-pscpp-duplicate-stems-v5.mjs
      - run: |
          node scripts/audit-question-quality-v2.mjs
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json reports/pscpp-stem-dedup-v5.json reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: remove enunciados duplicados pós-refino [stem-dedup-v5-output]"
          git pull --rebase origin main
          git push origin HEAD:main
