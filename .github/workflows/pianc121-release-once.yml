name: Release PIANC C1 in one audited batch
on:
  push:
    branches: [feature/pianc121-cge-cap1-quarentena]
    paths: ['.github/workflows/pianc121-release-once.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pianc121-cge-cap1-quarentena
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply consolidated PIANC editorial release
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          root=pathlib.Path('.')
          paths=[root/'data/questions/conhecimentos-gerais.json',root/'data/questions/imports/pianc121-cap1-quarentena.json']
          overrides={"CGE-PIANC121-C1-1-3-5":"Considerar os impactos do novo traçado, da bacia de evolução e das estruturas portuárias sobre o ambiente, além de utilizar os dados ambientais existentes no dimensionamento.","CGE-PIANC121-C1-1-3-5-1":"Utilizar os dados disponíveis com hipóteses conservadoras, planejar medições adicionais e refinar o projeto à medida que houver informações mais representativas.","CGE-PIANC121-C1-1-3-6":"Dimensionar verticalmente segundo navio, níveis de água e fundo, e horizontalmente segundo tráfego, manobra, sinalização e condições físicas, considerando suas interdependências.","CGE-PIANC121-C1-1-3-6-1":"Considerar assoreamento e incerteza entre sondagens; compatibilizar os referenciais verticais e admitir níveis abaixo do Chart Datum ou LAT por efeitos meteorológicos.","CGE-PIANC121-C1-1-3-6-2":"Prever, segundo a demanda, duas faixas ou alargamentos para encontros controlados, avaliando navios, sinalização e condições físicas do canal.","CGE-PIANC121-C1-1-3-7-1":"Somar parcelas obtidas por tabelas ou expressões, incorporando implicitamente a segurança; para largura, recomenda-se complementação por simulações ou modelos físicos.","CGE-PIANC121-C1-1-3-7-2":"Analisar estatisticamente as trajetórias de manobra e conferir as dimensões frente a critérios probabilísticos de risco previamente estabelecidos.","CGE-PIANC121-C1-1-4-2-2":"Reavaliar profundidade, largura e alinhamento conjuntamente, considerando velocidade, ambiente e custo total do acesso.","CGE-PIANC121-C1-1-4-3-1":"Relacionar encontros e colisões estimados por simulação às consequências, privilegiando comparações relativas de risco entre alternativas de projeto.","CGE-PIANC121-C1-1-4-3-2":"A soma dos máximos tende a superestimar a profundidade quando os efeitos são independentes e seus extremos raramente coincidem.","CGE-PIANC121-C1-1-4-3-3":"Repetir cada manobra ao menos dez vezes nas condições extremas, avaliar a dispersão lateral e estimar probabilidades de excedência.","CGE-PIANC121-C1-1-4-4":"Ampliar a avaliação de risco para abranger navegação, manobra, atracação, amarração e desatracação nas áreas aquáticas relacionadas.","CGE-PIANC121-C1-1-4-5":"Reavaliar a operação e o projeto, incluindo manobrabilidade, sinalização, rebocadores e simulações, antes de admitir navios maiores sem obras geométricas."}
          docs=[json.loads(p.read_text(encoding='utf-8')) for p in paths]
          before_others=[q for q in docs[0]['questions'] if not str(q['id']).startswith('CGE-PIANC121-C1-')]
          fingerprint=lambda x: hashlib.sha256(json.dumps(x,ensure_ascii=False,sort_keys=True).encode()).hexdigest()
          original_hash=fingerprint(before_others)
          for bank in docs:
              arr=[q for q in bank['questions'] if str(q['id']).startswith('CGE-PIANC121-C1-')]
              assert len(arr)==46,len(arr)
              for q in arr:
                  assert q.get('active') is False and q.get('status')=='quarantined',q['id']
                  assert q['taxonomy']['bibliography_id']=='pianc-channels' and q['taxonomy']['chapter_id']=='pianc-channels::ch1'
                  assert len(q['options'])==5 and {x['key'] for x in q['options']}==set('ABCDE')
                  assert q['correct_answer'] in set('ABCDE')
                  if q['id'] in overrides:
                      correct=next(o for o in q['options'] if o['key']==q['correct_answer'])
                      correct['text']=overrides[q['id']]
                  q['active']=True
                  q['status']='approved'
                  q['validation_status']='approved'
                  q.setdefault('quality',{})['quarantine_reason']=None
                  q['quality']['editorial_status']='approved_pianc121_cap1'
                  q['quality']['release_revision']='PIANC121-C1-2026-10-16'
              if 'validation' in bank:
                  bank['validation']['pianc121_quarantine_count']=0
                  bank['validation']['pianc121_active_count']=46
              assert len({q['id'] for q in bank['questions']})==len(bank['questions'])
          assert original_hash==fingerprint([q for q in docs[0]['questions'] if not str(q['id']).startswith('CGE-PIANC121-C1-')])
          for p,bank in zip(paths,docs):
              p.write_text(json.dumps(bank,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('PASS: 46 PIANC activated, 13 answer-length corrections, prior 1185 untouched')
          PY
      - name: Update focused regression test
        run: |
          cat > scripts/test-pianc121-cge-quarantine.mjs <<'JS'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { isQuestionActive } from "../lib/question-quality-policy.js";
          import { validateQuestionTaxonomy } from "../lib/question-taxonomy.js";
          const bank=JSON.parse(readFileSync(new URL("../data/questions/conhecimentos-gerais.json",import.meta.url),"utf8"));
          const items=bank.questions.filter(q=>q.id.startsWith("CGE-PIANC121-C1-"));
          assert.equal(bank.questions.length,1231);
          assert.equal(items.length,46);
          assert.equal(new Set(bank.questions.map(q=>q.id)).size,1231);
          for(const q of items){
            assert.equal(q.active,true,q.id);
            assert.equal(q.status,"approved",q.id);
            assert.equal(isQuestionActive(q),true,q.id);
            assert.deepEqual(validateQuestionTaxonomy(q,"conhecimentos-gerais").errors,[],q.id);
            assert.deepEqual(new Set(q.options.map(x=>x.key)),new Set(["A","B","C","D","E"]),q.id);
            assert.ok(q.options.some(x=>x.key===q.correct_answer),q.id);
          }
          console.log("PASS: all 46 PIANC Chapter 1 questions active with canonical taxonomy");
          JS
      - name: Verify 46 active questions in real generated runtime
        run: |
          node scripts/test-pianc121-cge-quarantine.mjs
          node --no-warnings --experimental-loader ./scripts/pscpp-json-loader.mjs scripts/generate-runtime-question-banks.mjs
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const runtime=JSON.parse(fs.readFileSync('data/questions/runtime-active-banks.json','utf8'));
          const q=runtime.banks['conhecimentos-gerais'].questions.filter(x=>String(x.id||'').startsWith('CGE-PIANC121-C1-'));
          assert.equal(q.length,46,'PIANC not fully served in runtime');
          console.log('PASS: 46 PIANC questions present in active CGE runtime');
          JS
      - name: Update PIANC runtime regression workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/pianc121-cge-quarantine-test.yml')
          s=p.read_text()
          s=s.replace("assert.equal(leaked.length,0,'PIANC questions leaked into active runtime');","assert.equal(leaked.length,46,'PIANC questions absent from active runtime');")
          s=s.replace("PASS: no PIANC quarantine questions in generated runtime bank.","PASS: 46 released PIANC questions in generated runtime bank.")
          p.write_text(s)
          PY
      - name: Commit only after all PIANC release validations pass
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/questions/conhecimentos-gerais.json data/questions/imports/pianc121-cap1-quarentena.json scripts/test-pianc121-cge-quarantine.mjs .github/workflows/pianc121-cge-quarantine-test.yml
          git commit -m 'feat(cge): release 46 PIANC 121 C1 questions after editorial batch'
          git push origin HEAD:feature/pianc121-cge-cap1-quarentena
