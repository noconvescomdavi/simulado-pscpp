name: RIPEAM Editor Pro Suite
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply upgrade
        run: python scripts/upgrade-ripeam-pro.py
      - name: Validate manual-publication invariant
        run: |
          grep -q 'RIPEAM_ASSET_HASHES' lib/ripeam-asset-manifest.js
          grep -q 'versionRipeamAssetUrl' app/admin/laboratorio-3d/Admin3DViewport.js
          grep -q 'versionRipeamAssetUrl' app/flashcards/ripeam/3d/RipeamThreeScene.js
          grep -q 'saveLocalRecovery' app/admin/laboratorio-3d/Admin3DEditor.js
          grep -q 'onMaterialInventory' app/admin/laboratorio-3d/Admin3DViewport.js
          grep -q 'DRACOLoader' app/admin/laboratorio-3d/Admin3DViewport.js
          grep -q 'KTX2Loader' app/admin/laboratorio-3d/Admin3DViewport.js
          grep -q 'MeshoptDecoder' app/admin/laboratorio-3d/Admin3DViewport.js
          grep -q 'previewThumbnail' app/admin/laboratorio-3d/Admin3DEditor.js
          ! grep -q 'setTimeout(()=>save("draft"' app/admin/laboratorio-3d/Admin3DEditor.js
      - name: Install
        run: npm ci --ignore-scripts
      - name: Build
        run: npm run build
      - name: Commit upgrade
        run: |
          rm -f .github/workflows/ripeam-editor-pro-suite.yml scripts/upgrade-ripeam-pro.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(editor-3d): adiciona suite profissional RIPEAM v2'
          git push origin HEAD:main
