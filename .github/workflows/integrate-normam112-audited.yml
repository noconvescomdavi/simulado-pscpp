name: Integrate audited NORMAM-112 bank
on:
  push:
    branches:
      - feature/normam-112-audited-bank-20260930-v2
    paths:
      - "data/question-extensions/normam-112-audited.json"
      - "scripts/integrate-normam112-audited.mjs"
      - ".github/workflows/integrate-normam112-audited.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate and validate NORMAM-112
        run: node scripts/integrate-normam112-audited.mjs
      - name: Commit integrated bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/legislacao-regulamentacao.json
          git diff --cached --quiet && exit 0
          git commit -m "feat(questions): integrate audited NORMAM-112 bank [skip ci]"
          git push origin HEAD:feature/normam-112-audited-bank-20260930-v2
