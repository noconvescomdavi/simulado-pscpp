name: Quarantine Invalid Taxonomy
on:
  push:
    branches: [audit/pscpp-complete-quality-20260923]
jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message || '', '[taxonomy-output]') }}
    permissions: {contents: write}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node scripts/quarantine-invalid-taxonomy.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions
          git commit -m "fix: quarantine invalid-taxonomy questions [taxonomy-output]" || exit 0
          git pull --rebase origin audit/pscpp-complete-quality-20260923\n          git push
