name: Fix Miguens Locator Stems

on:
  push:
    branches: [feature/miguens-v3-bancos-378]
    paths:
      - .github/workflows/fix-miguens-locator-stems.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/miguens-v3-bancos-378
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite locator-dependent stems
        run: node scripts/fix-miguens-locator-stems.mjs
      - name: Validate Miguens integration
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const sets = [
            ["data/questions/navegacao-aguas-restritas.json", /^NAV-MIGV3-C(37|38|40|42)-/, 255, 2080],
            ["data/questions/meteorologia-oceanografia.json", /^MEO-MIGV3-C45-/, 123, 1353]
          ];
          const locatorDependent = stem => {
            const hasLocator = /\b(?:item|itens|art(?:igo)?\.?|artigos?|se[cç][aã]o|cap[ií]tulo|al[ií]nea|par[aá]grafo|anexo|regra)\s+(?:n[º°.]?\s*)?[0-9IVXLCDM]/i.test(stem);
            const hasObject = /[“"][^”"]{8,}[”"]|(?:sobre|relativo a|referente a|em relação a|que trata de)\s+[^?.:]{8,}/i.test(stem);
            return hasLocator && !hasObject;
          };
          for (const [path,re,expected,total] of sets) {
            const bank=JSON.parse(fs.readFileSync(path,"utf8"));
            if (bank.questions.length !== total) throw new Error(path + " total=" + bank.questions.length);
            const qs=bank.questions.filter(q=>re.test(String(q.id||"")));
            if (qs.length !== expected) throw new Error(path + " Miguens=" + qs.length);
            for (const q of qs) {
              const keys=(q.options||[]).map(o=>o.key);
              if (keys.join("") !== "ABCDE" || !keys.includes(q.correct_answer)) throw new Error(q.id+" schema/gabarito inválido");
              if (locatorDependent(q.question)) throw new Error(q.id+" depende de localizador");
            }
          }
          console.log("378 questões Miguens validadas sem dependência de localizador.");
          NODE
      - name: Commit rewritten banks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/navegacao-aguas-restritas.json data/questions/meteorologia-oceanografia.json
          git diff --cached --quiet || git commit -m "fix(questions): remove localizadores dos enunciados Miguens"
          git push

# retry-after-solas-locator-fix
