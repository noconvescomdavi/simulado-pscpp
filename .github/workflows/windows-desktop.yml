name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop-offline
    paths:
      - "app/**"
      - "lib/**"
      - "desktop/**"
      - "db/**"
      - "public/**"
      - "protected-content/**"
      - "package.json"
      - "next.config.mjs"
      - ".github/workflows/windows-desktop.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PSCPP_DESKTOP: "1"
      AUTH_SECRET: "desktop-build-only-secret-not-used-at-runtime-000000000000"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:32145"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate question banks
        run: npm run validate:questions
      - name: Build standalone web application
        run: npm run desktop:build:web
      - name: Package Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ESTIBORDO-PSCPP-Windows-x64
          path: dist/ESTIBORDO-PSCPP-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
