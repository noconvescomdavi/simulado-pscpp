name: Audit normal question bank

on:
  push:
    branches:
      - fix/format-all-question-bank-v2
    paths:
      - ".github/workflows/audit-normal-question-bank.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/format-all-question-bank-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Rebuild problematic generated questions
        run: node scripts/revise-question-banks-context-v2.mjs
      - name: Audit normal bank
        run: node scripts/audit-question-quality-v2.mjs
      - name: Report contextless fragments
        run: |
          grep -RniE 'Descrição: (Este|Esta|Esse|Essa)|qual alternativa reproduz corretamente|qual enunciado define corretamente o conteúdo de item' data/questions/*.json > reports/contextless-fragments.txt || true
          echo "Contextless/template occurrences: $(wc -l < reports/contextless-fragments.txt)"
      - name: Fail on semantic nonsense
        run: |
          node -e "const r=require('./reports/question-quality-audit-v2.json'); const bad=r.flags.filter(x=>['TOPIC_REPEATED_AS_OPTION','TAUTOLOGICAL_ASSERTION','UNDEFINED_ASSOCIATION','ORPHAN_REFERENCE','FRAGMENT_STEM','META_TEXT_TAUTOLOGY'].includes(x.code)); console.log('semantic nonsense:',bad.length); if(bad.length){console.log(bad.slice(0,50)); process.exit(1)}"
      - name: Validate question banks
        run: npm run validate:questions
      - name: Structural tests
        run: npm run test:question-structure
      - name: Build
        run: npm run build
      - name: Commit corrected normal-bank data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions reports/question-context-revision-v2.json reports/question-context-revision-v2.md reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/contextless-fragments.txt
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "fix(questions): audit and normalize normal question bank"
          git push origin HEAD:fix/format-all-question-bank-v2

