name: Audit Question Quality Main
# PSCPP benchmark audit

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/audit-question-quality-v2.mjs'
      - '.github/workflows/audit-question-quality-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    if: ${{ !contains(github.event.head_commit.message, '[quality-main-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit question quality
        run: |
          node scripts/audit-question-quality-v2.mjs
          node scripts/extract-question-quality-samples.mjs
          node scripts/report-question-stem-patterns.mjs
      - name: Validate
        run: |
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/question-quality-samples.md reports/question-stem-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualiza auditoria PSCPP [quality-main-output]"
          git pull --rebase origin main
          git push origin HEAD:main
