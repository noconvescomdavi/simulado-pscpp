name: Repair Naval Shiphandling Chapter 2 schema
on:
  push:
    branches: [fix/manobrabilidade-ch2-option-keys]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fix-naval-shiphandling-ch2-option-keys.mjs
      - run: npm run validate:questions
      - name: Commit repaired bank
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/manobrabilidade.json
          git diff --cached --quiet && exit 0
          git commit -m "fix(questions): normalize Chapter 2 option keys"
          git push
