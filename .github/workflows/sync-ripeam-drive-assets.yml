name: Sync RIPEAM Drive assets
on:
  push:
    branches:
      - fix/ripeam-drive-sync-20260909
permissions:
  contents: write
jobs:
  sync-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ripeam-drive-sync-20260909
      - name: Download Drive GLBs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/models/ripeam
          python -m pip install --quiet gdown
          gdown "1TFCticl5ngtSEUX4d8lC5EmR9zCPLcpz" -O public/models/ripeam/offshore.glb
          gdown "1_ZdSHP9Xhm5EyvJgemd43U3f9mhUO8b9" -O "public/models/ripeam/navy_remoção_de_minas.glb"
          test "$(stat -c%s public/models/ripeam/offshore.glb)" -eq 9352932
          test "$(stat -c%s "public/models/ripeam/navy_remoção_de_minas.glb")" -eq 4683556
      - name: Commit binary assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/ripeam/offshore.glb "public/models/ripeam/navy_remoção_de_minas.glb"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(ripeam-3d): adiciona offshore e remoção de minas do Drive"
          git push origin HEAD:fix/ripeam-drive-sync-20260909
