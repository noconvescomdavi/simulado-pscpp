name: Android Publish Internal

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão visível (ex.: 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

jobs:
  publish-internal:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate publication secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$KEYSTORE" || (echo "ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD ausente" && exit 1)
          test -n "$KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS ausente" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "ANDROID_KEY_PASSWORD ausente" && exit 1)
          test -n "$PLAY_JSON" || (echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON ausente" && exit 1)

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        run: npx cap add android

      - name: Generate ESTIBORDO icons and splash
        run: npm run android:assets

      - name: Configure Android metadata
        env:
          ESTIBORDO_VERSION_CODE: ${{ github.run_number }}
          ESTIBORDO_VERSION_NAME: ${{ inputs.version_name }}
        run: npm run android:configure

      - name: Prepare Firebase configuration
        env:
          FIREBASE_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$FIREBASE_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo "Firebase Android configurado."
          else
            echo "Firebase não configurado; push permanecerá inativo."
          fi

      - name: Prepare upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/estibordo-upload.jks

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/mobile/android/estibordo-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: node scripts/configure-release-signing.mjs

      - name: Build release AAB
        run: ./gradlew bundleRelease
        working-directory: mobile/android

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: estibordo-${{ inputs.version_name }}-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload to Google Play Internal
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: br.com.estibordo.pscpp
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
