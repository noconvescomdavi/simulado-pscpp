name: Build Arte Naval Cap8 504
on:
  push:
    branches: [feature/pscpp-arte-naval-cap8-504]
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feature/pscpp-arte-naval-cap8-504 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/build-arte-naval-cap8-504.mjs
      - name: Validate Cap8 bank
        run: |
          node - <<'NODE'
          const j=require('./data/pscpp/arte-naval-cap8-504.json');
          if(j.inventory_count!==168 || j.questions.length!==504) process.exit(1);
          if(new Set(j.questions.map(q=>q.id)).size!==504) process.exit(1);
          if(j.questions.some(q=>q.options?.length!==5 || !q.correct_answer || !q.source?.locator)) process.exit(1);
          const f={}; for(const q of j.questions) f[q.pscpp_format]=(f[q.pscpp_format]||0)+1;
          if(f.assertions!==168||f.direct!==168||f.true_false!==168) process.exit(1);
          console.log({total:j.questions.length,formats:f});
          NODE
      - name: Commit bank and loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pscpp/arte-naval-cap8-504.json lib/pscpp-exam-bank.js
          git diff --cached --quiet || git commit -m "feat: integra 504 questões Arte Naval capítulo 8"
          git push
