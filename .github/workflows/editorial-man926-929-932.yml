name: Editorial cleanup MAN-926 929 932
on:
  push:
    branches: [audit/revisao-enunciados-repetidos-20261107]
    paths: [audit-patches/man926-929-932.json]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact original texts and patch only question fields
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const path='data/questions/manobrabilidade.json';
          const patch=JSON.parse(fs.readFileSync('audit-patches/man926-929-932.json','utf8'));
          const bank=JSON.parse(fs.readFileSync(path,'utf8'));
          if(!Array.isArray(bank.questions))throw Error('Unexpected bank schema');
          const found=[];
          for(const p of patch){
            const matches=bank.questions.filter(q=>q.id===p.id);
            if(matches.length!==1)throw Error('Expected one '+p.id+', found '+matches.length);
            const q=matches[0];
            if(q.question!==p.old)throw Error('Concurrent question modification: '+p.id);
            q.question=p.new;found.push(p.id);
          }
          fs.writeFileSync(path,JSON.stringify(bank,null,2)+'\n');
          console.log('Patched only question fields:',found.join(', '));
          NODE
      - name: Commit direct bank correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/manobrabilidade.json
          git diff --cached --quiet || (git commit -m "fix: remove redundant introductory clauses MAN-926 929 932" && git push)
