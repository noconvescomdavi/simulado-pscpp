name: Validate RIPEAM environment and textures
on:
  push:
    branches: [feat/editor-object-lighting-20260910]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit GLB texture maps
        shell: python
        run: |
          import json,struct,pathlib,sys
          root=pathlib.Path("public/models/ripeam")
          expected={
            "Tugboat.glb":1,"barge.glb":1,"bulk_carrier.glb":1,"fishing.glb":1,
            "hidroavião.glb":1,"navy_remoção_de_minas.glb":1,"pilot_boat.glb":1,"sailboat.glb":1
          }
          bad=[]
          for p in sorted(root.glob("*.glb")):
            data=p.read_bytes()
            if data[:4]!=b"glTF":
              print("GLB|%s|INVALID"%p.name);bad.append(p.name);continue
            off=12;doc=None
            while off+8<=len(data):
              ln,typ=struct.unpack_from("<II",data,off);off+=8
              chunk=data[off:off+ln];off+=ln
              if typ==0x4E4F534A:
                doc=json.loads(chunk.rstrip(b" \t\r\n\x00").decode("utf-8"));break
            if doc is None: bad.append(p.name);continue
            mats=doc.get("materials",[]);imgs=doc.get("images",[]);tex=doc.get("textures",[])
            base=normal=mr=ao=em=0
            for m in mats:
              pbr=m.get("pbrMetallicRoughness",{})
              base+=int("baseColorTexture" in pbr);mr+=int("metallicRoughnessTexture" in pbr)
              normal+=int("normalTexture" in m);ao+=int("occlusionTexture" in m);em+=int("emissiveTexture" in m)
            print(f"GLB|{p.name}|materials={len(mats)}|textures={len(tex)}|images={len(imgs)}|base={base}|normal={normal}|mr={mr}|ao={ao}|emissive={em}")
            if p.name in expected and len(imgs)<expected[p.name]: bad.append(p.name)
          if bad:
            print("Texture regression:",",".join(bad));sys.exit(1)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
