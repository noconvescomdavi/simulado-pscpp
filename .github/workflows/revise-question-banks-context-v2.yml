name: Revise Question Banks Context V2

on:
  push:
    branches:
      - fix/revisao-profunda-bancos-20260907
    paths:
      - 'scripts/revise-question-banks-context-v2.mjs'
      - 'scripts/harden-context-revision-v2.mjs'
      - 'scripts/fix-audit-math-normalization.mjs'
      - '.github/workflows/revise-question-banks-context-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revisao-profunda-bancos-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Harden contextual revision
        run: node scripts/harden-context-revision-v2.mjs
      - name: Fix audit normalization
        run: node scripts/fix-audit-math-normalization.mjs
      - name: Revise all question banks
        run: node scripts/revise-question-banks-context-v2.mjs
      - name: Deep audit after revision
        run: node scripts/audit-question-quality-v2.mjs
      - name: Extract review samples
        run: node scripts/extract-question-quality-samples.mjs
      - name: Report stem patterns
        run: node scripts/report-question-stem-patterns.mjs
      - name: Validate repository
        run: npm run validate
      - name: Commit reviewed banks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json scripts/revise-question-banks-context-v2.mjs scripts/audit-question-quality-v2.mjs reports/question-context-revision-v2.json reports/question-context-revision-v2.md reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/question-quality-samples.md reports/question-stem-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: revisa contexto e dificuldade dos bancos [context-revision-v2-output]"
          git pull --rebase origin fix/revisao-profunda-bancos-20260907
          git push origin HEAD:fix/revisao-profunda-bancos-20260907
