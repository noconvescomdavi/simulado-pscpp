name: Upgrade Question Banks to PSCPP V3

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-question-banks-pscpp-v3.mjs'
      - '.github/workflows/upgrade-question-banks-pscpp-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: ${{ !contains(github.event.head_commit.message, '[pscpp-v3-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Upgrade banks to PSCPP style
        run: node scripts/upgrade-question-banks-pscpp-v3.mjs
      - name: Deep quality audit
        run: node scripts/audit-question-quality-v2.mjs
      - name: Review samples and stem patterns
        run: |
          node scripts/extract-question-quality-samples.mjs
          node scripts/report-question-stem-patterns.mjs
      - name: Validate repository and question banks
        run: |
          npm run check:repo
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit upgraded banks and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json reports/pscpp-style-upgrade-v3.json reports/pscpp-style-upgrade-v3.md reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/question-quality-samples.md reports/question-stem-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: eleva bancos ao padrão PSCPP [pscpp-v3-output]"
          git pull --rebase origin main
          git push origin HEAD:main
