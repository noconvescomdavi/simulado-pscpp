name: Audit Question Quality V2

on:
  push:
    branches:
      - fix/revisao-profunda-bancos-20260907
    paths:
      - 'scripts/audit-question-quality-v2.mjs'
      - 'scripts/extract-question-quality-samples.mjs'
      - 'scripts/report-question-stem-patterns.mjs'
      - 'data/questions/*.json'
      - '.github/workflows/audit-question-quality-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/revisao-profunda-bancos-20260907
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run quality audit
        run: node scripts/audit-question-quality-v2.mjs
      - name: Extract review samples
        run: node scripts/extract-question-quality-samples.mjs
      - name: Report stem patterns
        run: node scripts/report-question-stem-patterns.mjs
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/question-quality-samples.md reports/question-stem-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: atualiza auditoria de qualidade dos bancos [quality-audit-output]"
          git pull --rebase origin fix/revisao-profunda-bancos-20260907
          git push origin HEAD:fix/revisao-profunda-bancos-20260907
