name: Cleanup PSCPP Medium Flags V8
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cleanup-pscpp-v8.mjs'
      - '.github/workflows/cleanup-pscpp-v8.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[pscpp-v8-output]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm ci
      - run: node scripts/cleanup-pscpp-v8.mjs
      - run: |
          node scripts/audit-question-quality-v2.mjs
          node scripts/extract-question-quality-samples.mjs
          node scripts/report-question-stem-patterns.mjs
          npm run validate:questions
          npm run validate:taxonomy
      - name: Commit V8
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/questions/*.json reports/pscpp-cleanup-v8.json reports/question-quality-audit-v2.json reports/question-quality-audit-v2.md reports/question-quality-samples.md reports/question-stem-patterns.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: limpa avisos médios fora do baseline protegido [pscpp-v8-output]"
          git pull --rebase origin main
          git push origin HEAD:main
