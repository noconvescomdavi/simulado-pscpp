<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NV2 Chart Viewer V2</title>
<style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark}
body{margin:0;background:#071c2a;color:#eaf6ff}header{display:flex;gap:12px;align-items:center;padding:14px 18px;background:#0a2b40;border-bottom:1px solid #24506a}
header h1{font-size:18px;margin:0}.btn{background:#0d5c82;color:#fff;border:1px solid #287ba3;border-radius:8px;padding:9px 14px;cursor:pointer}
main{display:grid;grid-template-columns:340px 1fr;height:calc(100vh - 60px)}aside{padding:14px;background:#092335;overflow:auto;border-right:1px solid #24506a}
canvas{width:100%;height:100%;display:block;background:#b8d9e4}
.card{background:#061925;border:1px solid #24485d;border-radius:10px;padding:10px;margin:10px 0}.muted{color:#9ec8de}.ok{color:#73e7a3}.warn{color:#ffd36f}.bad{color:#ff8e8e}
pre{white-space:pre-wrap;word-break:break-word;font-size:12px;max-height:340px;overflow:auto}label{display:block;margin:6px 0}input[type=file]{max-width:100%}
</style>
</head>
<body>
<header><h1>NV2 Chart Viewer V2</h1><input id="file" type="file" accept=".nv2"><button id="fit" class="btn">Enquadrar</button><button id="export" class="btn">Exportar diagnóstico</button></header>
<main><aside>
<div class="card"><b>Estado</b><div id="state" class="muted">Abra uma carta .nv2</div></div>
<div class="card"><b>Camadas reconhecidas</b>
<label><input id="showLines" type="checkbox" checked> sequências geométricas confiáveis</label>
<label><input id="showPoints" type="checkbox" checked> pontos isolados confiáveis</label>
</div>
<div class="card"><b>Compatibilidade</b><div id="compat" class="muted">Ainda não analisado.</div></div>
<div class="card"><b>Diagnóstico</b><pre id="diag">{}</pre></div>
</aside><section><canvas id="c"></canvas></section></main>
<script type="module" src="./src/viewer.js"></script>
</body></html>
